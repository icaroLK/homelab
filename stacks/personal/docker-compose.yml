services:

# ================ N8N ====================
  redis_n8n:
    image: redis:alpine
#    command: ["redis-server", "--requirepass", "${REDIS_N8N_PASSWORD}"]
    command: ["redis-server", "--requirepass", "${REDIS_N8N_PASSWORD}", "--notify-keyspace-events", "Ex"]
    volumes:
#      - ./data/redis/n8n:/data
      - /home/kucha/data/personal/redis/n8n:/data

    restart: always
  postgres_n8n:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_N8N_DB}
      POSTGRES_USER: ${POSTGRES_N8N_USER}
      POSTGRES_PASSWORD: ${POSTGRES_N8N_PASSWORD}
    volumes:
#      - ./data/postgres/n8n:/var/lib/postgresql/data
      - /home/kucha/data/personal/postgres/n8n:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n
    ports:
      - "${N8N_PORT}:5678"
    depends_on:
      - redis_n8n
      - postgres_n8n
    restart: always
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres_n8n
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_N8N_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_N8N_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_N8N_PASSWORD}
      - QUEUE_MODE=redis
      - REDIS_HOST=redis_n8n
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_N8N_PASSWORD}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_DEFAULT_LOCALE=pt
      - N8N_SECURE_COOKIE=false

    volumes:
      - /home/kucha/data/personal/n8n:/home/node/.n8n
#      - ./data/n8n:/home/node/.n8n




# ============== EVOLUTION ===============
  redis_evolution:
    image: redis:alpine
    command: ["redis-server", "--requirepass", "${REDIS_EVOLUTION_PASSWORD}"]
    restart: always
    volumes:
      - /home/kucha/data/personal/redis/evolution:/data
#      - ./data/redis/evolution:/data

  postgres_evolution:
    image: postgres:14
    environment:
      POSTGRES_DB: ${POSTGRES_EVOLUTION_DB}
      POSTGRES_USER: ${POSTGRES_EVOLUTION_USER}
      POSTGRES_PASSWORD: ${POSTGRES_EVOLUTION_PASSWORD}
    restart: always
    volumes:
      - /home/kucha/data/personal/postgres/evolution:/var/lib/postgresql/data
#      - ./data/postgres/evolution:/var/lib/postgresql/data

  evolution:
    image: icarolk/evolution:custom
    depends_on:
      - redis_evolution
      - postgres_evolution
    ports:
      - "${EVOLUTION_PORT}:8080"
    env_file: .env.evolution
    restart: always
    volumes:
#      - ./data/evolution/store:/evolution/store
#      - ./data/evolution/instances:/evolution/instances
      - /home/kucha/data/personal/evolution/store:/evolution/store
      - /home/kucha/data/personal/evolution/instances:/evolution/instances

